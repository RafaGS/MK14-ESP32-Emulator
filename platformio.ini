[env:esp32dev]
platform = espressif32@53.3.13
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=3
  -I.
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
board_build.filesystem = littlefs
lib_deps =
  me-no-dev/ESPAsyncWebServer@3.6.0
  ESP32Async/AsyncTCP@3.5.0
  bblanchon/ArduinoJson@7.4.3
